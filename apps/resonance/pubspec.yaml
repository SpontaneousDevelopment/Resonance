name: resonance
description: "Gamified voice-acting training for iOS, Android and macOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  collection: ^1.19.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^18.0.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true

  assets:
    # Compiled by tools/curriculum_build. Bundled rather than fetched so the
    # skill tree renders on first launch with no network.
    - assets/seed/
