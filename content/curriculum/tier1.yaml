# Tier 1 — Foundations
#
# Authoring source of truth. Compiled to a validated JSON seed by
# `tools/curriculum_build`; the app never reads this file directly.
#
# Lesson ids are permanent. Progress is keyed on them, so renaming a lesson is
# free but renumbering one destroys a user's history. Never reuse an id.

number: 1
title: Foundations
summary: >-
  The instrument before the music. Nothing here is about acting — it is about
  knowing what your voice does, repeating it on purpose, and not hurting
  yourself along the way.

units:
  # ── The first unit anyone meets. Fully authored. ─────────────────────────
  #
  # Diagnostic, not drilling. Every lesson here is a measurement the user takes
  # of themselves, and the briefs say so — someone who reads a baseline take as
  # a test they can fail will perform to the test, and the baseline is then
  # worth nothing. See Design.md, "Authoring a lesson".
  #
  # All five are scoredRead because that is the only type with a working
  # runtime path today. Mapping range properly wants pitchMatch, which is
  # declared in LessonType and not implemented; lesson 2 approaches it through
  # what the rubric can actually measure — whether clarity survives a change of
  # placement — rather than declaring a type the app would render as a
  # record-and-score screen anyway.
  - id: t1u1-meet-your-voice
    tier: 1
    index: 1
    title: Meet Your Voice
    summary: >-
      A baseline take, a map of your range, and an honest inventory of the
      habits you cannot hear yet.
    lessons:
      - id: t1u1l1-baseline-take
        unit_id: t1u1-meet-your-voice
        title: Your Voice, Unedited
        type: scoredRead
        estimated_seconds: 120
        brief: >-
          This one is a measurement, not a test. Read it the way you would read
          anything aloud to another person in the room — no performance, no
          radio voice. The score you get here is the number everything later is
          compared against, so an honest one is worth more to you than a good
          one. The pace band is deliberately wide: we are finding out where you
          naturally sit, not correcting it yet.
        target_wpm_min: 110
        target_wpm_max: 180
        reference:
          source: none
        script: >-
          The kettle clicked off just as the rain started. I put my cup down,
          looked out at the street, and decided the walk could wait. Somewhere
          below, a door closed twice — once quietly, then again with feeling.

      - id: t1u1l2-two-ends
        unit_id: t1u1-meet-your-voice
        title: The Two Ends of Your Voice
        type: scoredRead
        estimated_seconds: 180
        brief: >-
          Read this twice. The first time, sit at the bottom of where your voice
          is comfortable — the pitch you land on when you are tired. The second
          time, take it as high as you can go without strain or falsetto. Your
          score is the clarity of the *worse* of the two passes. Most people
          lose consonants at one end and never find out which.
        target_wpm_min: 120
        target_wpm_max: 160
        reference:
          source: none
        script: >-
          I found the letter behind the radiator, still sealed, still addressed
          to a man who moved out eleven years ago.

      - id: t1u1l3-sentence-ends
        unit_id: t1u1-meet-your-voice
        title: Where Your Sentences Go
        type: scoredRead
        estimated_seconds: 120
        brief: >-
          Almost everyone starts a sentence with energy and arrives at the end
          of it with none. Six short sentences, each landing on a hard
          consonant. If your volume falls away before the full stop, those
          consonants disappear and the score will show you exactly which ones
          went. Listen for the last word of each sentence, not the first.
        target_wpm_min: 125
        target_wpm_max: 160
        reference:
          source: none
        script: >-
          The train left at eight. He locked the shed and lost the key. She kept
          the receipt. It rained all night. The dog stayed out. Nobody asked
          what happened next.

      - id: t1u1l4-slower-than-you-think
        unit_id: t1u1-meet-your-voice
        title: Slower Than You Think
        type: scoredRead
        estimated_seconds: 150
        brief: >-
          A microphone makes people hurry. The pace band here is the lesson.
          It is set lower than feels natural on a first recording, so reading
          this at the speed it seems to want will land you outside it. Nothing
          about the words needs urgency. Say them at the speed you would use
          giving directions to someone who has to remember them.
        target_wpm_min: 115
        target_wpm_max: 140
        reference:
          source: none
        script: >-
          There is a fire door at the end of the corridor. It opens outward. If
          the alarm sounds, walk to it, push the bar, and stand well clear of
          the building.

      - id: t1u1l5-one-minute
        unit_id: t1u1-meet-your-voice
        title: One Minute, No Edits
        type: scoredRead
        estimated_seconds: 210
        brief: >-
          The longest read in the unit, and the first one where staying the same
          is the difficulty. Quality decays over length: breath gets shallower,
          consonants soften, pace drifts up. The last third of this passage is
          where your habits live. Read it once, all the way through, without
          stopping to fix anything.
        target_wpm_min: 125
        target_wpm_max: 165
        reference:
          source: none
        script: >-
          The building had been a print works, then a furniture store, then
          nothing at all for most of a decade. When they finally opened the
          doors again the floor was still stained black in long lines where the
          presses had stood, and nobody had the heart to sand them out. The new
          owners left them, put tables between them, and told anyone who asked
          that the marks were the reason they had bought the place. On a quiet
          afternoon you could still smell ink under the coffee. The woman who
          ran the counter said it faded in summer and came back every autumn,
          which was not true, but everyone repeated it anyway.

  - id: t1u2-breath-support
    tier: 1
    index: 2
    title: Breath & Support
    summary: >-
      Diaphragmatic setup, sustained tone under load, and the silent catch-breath
      that keeps a long line from collapsing.
    prerequisites: [t1u1-meet-your-voice]
    planned_lesson_count: 7

  # ── The MVP unit. Fully authored. ────────────────────────────────────────
  - id: t1u3-articulation
    tier: 1
    index: 3
    title: Articulation & Diction
    summary: >-
      Consonants are where intelligibility lives. This unit trains precision
      without tipping into the over-enunciated read that marks an amateur.
    prerequisites: [t1u2-breath-support]
    lessons:
      - id: t1u3l1-plosive-precision
        unit_id: t1u3-articulation
        title: Plosive Precision
        type: scoredRead
        estimated_seconds: 120
        brief: >-
          Read at a steady, conversational pace. Land every P, B, T, D, K and G
          cleanly — but keep the mic off-axis so the plosives stay crisp without
          thumping. Keep the tempo even, and don't push the P: let the consonant
          do the work while the breath behind it stays quiet. We score consonant
          clarity and plosive control together, because they pull against each
          other.
        target_wpm_min: 130
        target_wpm_max: 165
        reference:
          source: none
        script: >-
          Peter picked a bitter batch of pickled peppers, packed them tight,
          and put the barrel back beside the broken gate. The proper paper was
          buried beneath a big black book, but Bobby brought it back before
          breakfast.

      - id: t1u3l2-sibilance-control
        unit_id: t1u3-articulation
        title: Taming the S
        type: scoredRead
        estimated_seconds: 120
        brief: >-
          Sibilance is the fastest way to sound harsh on a condenser. Read this
          with fully formed S sounds that stay short — stop each one early and
          let the vowel carry the line. Long, hissing S sounds cost points;
          swallowed ones cost more.
        target_wpm_min: 130
        target_wpm_max: 165
        reference:
          source: none
        script: >-
          She sells sea shells, and the shells she sells are surely seaside
          shells. Six slick sisters swiftly stitched a silk sash, then set it
          aside to see whether the stitches would settle.

      - id: t1u3l3-medial-consonants
        unit_id: t1u3-articulation
        title: The Middle of the Word
        type: scoredRead
        estimated_seconds: 150
        brief: >-
          Most people articulate the start and end of a word and let the middle
          go. This passage is built almost entirely from words that fall apart
          if you do that.
        target_wpm_min: 120
        target_wpm_max: 155
        reference:
          source: none
        script: >-
          Particularly probable statistics regularly deteriorate under
          comparable circumstances. The temperature fluctuated considerably,
          and the laboratory's preliminary interpretation was consequently
          unreliable. February, library, comfortable, deteriorate.

      - id: t1u3l4-tempo-ladder
        unit_id: t1u3-articulation
        title: The Tempo Ladder
        type: scoredRead
        estimated_seconds: 180
        brief: >-
          Same line, three times: slow, conversational, then fast. Clarity must
          hold at every rung. Your score is the *lowest* clarity across the three
          passes, so the fast one is where the unit is won or lost.
        # Three rungs, each with its own band. The lesson-level band below is
        # the union of the three and is what a single-take reading would use.
        take_aggregation: lowest
        takes:
          - label: Slow
            target_wpm_min: 95
            target_wpm_max: 125
          - label: Conversational
            target_wpm_min: 130
            target_wpm_max: 165
          - label: Fast
            target_wpm_min: 175
            target_wpm_max: 215
        target_wpm_min: 110
        target_wpm_max: 210
        reference:
          source: none
        script: >-
          The rugged brigadier bragged briefly about the burglary before
          breakfast, then hurried back through the bracken.

      - id: t1u3l5-over-articulation-dial
        unit_id: t1u3-articulation
        title: The Over-Articulation Dial
        type: scoredRead
        estimated_seconds: 180
        brief: >-
          Now the opposite problem. Read this twice — once deliberately
          over-enunciated, once genuinely conversational. Both have to stay
          clear: your score is the weaker of the two, so dropping consonants the
          moment you relax is what costs you. Precision you cannot switch off is
          a limitation, not a skill.
        # Scored on the weaker take, not on the distance between them.
        #
        # The distance is the measure this lesson actually wants, and it does
        # not exist: it needs articulation precision independent of pace, and
        # the only candidate signal — recogniser confidence — is routinely not
        # reported by the platform. `take_aggregation: difference` is rejected
        # by the compiler for exactly this reason, so the mismatch cannot be
        # reintroduced silently. The brief above describes what is graded today.
        take_aggregation: lowest
        takes:
          - label: Over-enunciated
            target_wpm_min: 120
            target_wpm_max: 165
          - label: Conversational
            target_wpm_min: 140
            target_wpm_max: 180
        target_wpm_min: 120
        target_wpm_max: 180
        reference:
          source: none
        script: >-
          I told him I would be there at eight, and I meant it. It is not
          complicated. He just has to answer the phone.

      # ── Blocked on an editorial decision ────────────────────────────────
      #
      # The lesson type is built and wired; the clip is not chosen. Choosing
      # which performance is worth studying is a judgement, not something a
      # tool should default. `awaiting_selection` makes that explicit: the
      # compiler accepts it, warns on every build, and the app refuses to open
      # the lesson — so nothing can ship having quietly picked one.
      #
      # To unblock: verify a candidate with
      #   dart run tools/ingest/bin/ingest.dart add --youtube <id> --as <name>
      # then replace `awaiting_selection` with the video_id and in/out points.
      - id: t1u3l6-listen-and-analyse
        unit_id: t1u3-articulation
        title: Hear It Done Well
        type: listenAndAnalyse
        estimated_seconds: 180
        brief: >-
          Listen for the consonants, not the performance. Notice how little
          effort the plosives take, and how the sound stops rather than
          trailing. Then answer the two prompts below.
        script: >-
          Listen twice. The first time, follow the meaning. The second time,
          ignore it entirely and listen only to the ends of words.
        reference:
          source: embed
          awaiting_selection: true

  - id: t1u4-pitch-resonance
    tier: 1
    index: 4
    title: Pitch & Resonance
    summary: >-
      Chest, mask and head placement; mapping your usable range; holding and
      bending a contour on command.
    prerequisites: [t1u3-articulation]
    planned_lesson_count: 8

  - id: t1u5-microphone
    tier: 1
    index: 5
    title: Microphone Technique
    summary: >-
      Proximity effect, off-axis positioning, plosive control, distance dynamics,
      and setting gain by ear rather than by meter.
    prerequisites: [t1u4-pitch-resonance]
    planned_lesson_count: 7

  - id: t1u6-vocal-health
    tier: 1
    index: 6
    title: Warm-Ups & Vocal Health
    summary: >-
      Build a routine you will actually do, learn to read strain signals early,
      and practise the cool-down nobody bothers with.
    prerequisites: [t1u5-microphone]
    planned_lesson_count: 5

  - id: t1u7-reading-aloud
    tier: 1
    index: 7
    title: Reading Aloud
    summary: >-
      Sight-reading fluency, phrasing, marking a page, and treating punctuation
      as a musical score rather than grammar.
    prerequisites: [t1u6-vocal-health]
    planned_lesson_count: 8

  - id: t1u8-foundations-check
    tier: 1
    index: 8
    title: Foundations Check
    summary: >-
      An unseen battery drawn from all seven units. Passing opens Tier 2.
    prerequisites:
      - t1u1-meet-your-voice
      - t1u2-breath-support
      - t1u3-articulation
      - t1u4-pitch-resonance
      - t1u5-microphone
      - t1u6-vocal-health
      - t1u7-reading-aloud
    is_gate: true
    planned_lesson_count: 5
