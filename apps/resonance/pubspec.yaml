name: resonance
description: "Gamified voice-acting training for iOS, Android and macOS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  collection: ^1.19.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  freezed_annotation: ^3.1.0
  go_router: ^18.0.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  resonance_dsp:
    path: ../../packages/resonance_dsp
  permission_handler: ^13.0.1
  record: ^7.1.1
  riverpod_annotation: ^4.0.6
  webview_flutter: ^4.14.1
  youtube_player_iframe: ^6.0.2
  speech_to_text: ^7.4.0
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # Compiled by tools/curriculum_build. Bundled rather than fetched so the
    # skill tree renders on first launch with no network.
    - assets/seed/
    # The UI sound palette. Declared before the files exist so dropping a pack
    # in needs no pubspec change — see assets/sfx/CREDITS.md.
    - assets/sfx/

  # Variable fonts, bundled rather than fetched at runtime — the app must look
  # right offline on first launch. Weights are selected via FontVariation in
  # ui/tokens/typography.dart, not by shipping one file per weight.
  # All three are SIL Open Font License 1.1; see assets/fonts/OFL-*.txt.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
