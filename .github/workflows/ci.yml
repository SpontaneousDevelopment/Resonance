name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .fvmrc. CI installs Flutter directly rather than through
  # fvm — there is no other SDK on a runner to conflict with.
  FLUTTER_VERSION: 3.47.2

jobs:
  verify:
    name: Analyze, test, and compile the curriculum
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve workspace
        run: flutter pub get

      # Runs first: a broken curriculum should fail before anything else, and
      # its errors are the most actionable. Catches duplicate ids, dangling
      # prerequisites, cycles, unknown lesson types and uncredited references.
      - name: Compile the curriculum
        run: dart run tools/curriculum_build/bin/build.dart

      # The seed is committed so a fresh clone builds without running the tool.
      # If compiling changed it, someone edited the YAML and forgot to rebuild.
      - name: Check the committed seed is current
        run: |
          if ! git diff --quiet -- apps/resonance/assets/seed/curriculum.json; then
            echo "::error::The committed curriculum seed is stale."
            echo "Run: dart run tools/curriculum_build/bin/build.dart"
            git diff --stat -- apps/resonance/assets/seed/curriculum.json
            exit 1
          fi

      - name: Verify generated code is current
        working-directory: apps/resonance
        run: |
          dart run build_runner build
          if ! git diff --quiet -- '*.g.dart' '*.freezed.dart'; then
            echo "::error::Generated code is stale. Run build_runner."
            git diff --stat -- '*.g.dart' '*.freezed.dart'
            exit 1
          fi

      # A missing usage description is not a warning — the OS kills the app
      # with SIGABRT the instant the API is touched, with no Dart error at all.
      # Cheap to check, expensive to discover on a device.
      - name: Verify Info.plist privacy keys
        run: ./tools/verify_plists/verify.sh

      - name: Analyze
        run: flutter analyze

      - name: Format check
        run: dart format --set-exit-if-changed --output=none .

      - name: Test the app
        working-directory: apps/resonance
        run: flutter test --reporter=github

      # The DSP tests compile src/resonance_dsp.c into a standalone dylib and
      # exercise it through FFI — `flutter test` runs on the Dart VM, which is
      # not the app binary the podspec statically links the DSP into.
      - name: Test the DSP
        working-directory: packages/resonance_dsp
        run: flutter test --reporter=github

      # The C also has a standalone harness covering the algorithms themselves:
      # pitch accuracy against synthesised tones, octave and subharmonic
      # rejection, and the 60 fps frame budget.
      - name: Verify the DSP algorithms
        run: |
          cc -O2 -Ipackages/resonance_dsp/src \
             packages/resonance_dsp/src/resonance_dsp.c \
             packages/resonance_dsp/test/native/dsp_test.c \
             -o /tmp/dsp_test -lm
          /tmp/dsp_test

  verify-functions:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Supabase Edge Functions run on Deno. Type-checking them here catches
      # the class of mistake that otherwise only surfaces on deploy.
      - name: Check
        run: deno check backend/supabase/functions/**/*.ts

  build-apple:
    name: Build ${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            command: flutter build macos --debug
          - target: ios
            command: flutter build ios --debug --no-codesign
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/resonance
        run: ${{ matrix.command }}

      # Drives the real app binary, which is the only way to catch a dead-end
      # route or a missing Info.plist usage description — the OS kills the
      # process for the latter with no Dart error at all.
      #
      # microphone_test.dart is deliberately excluded: its first access raises a
      # modal permission dialog, and with nobody to click it the run blocks.
      - name: Integration tests
        if: matrix.target == 'macos'
        working-directory: apps/resonance
        run: flutter test integration_test/lesson_flow_test.dart -d macos

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Android Gradle Plugin does not support the newest JDKs; 21 is the
          # current safe ceiling. The dev machine should match.
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        working-directory: apps/resonance
        run: flutter build apk --debug
